[package]
name = "nostr-sync"
version = "0.1.0"
edition = "2024"
description = "A tiny service that periodically syncs events between own relays."
authors = ["Yuki Kishimoto <yukikishimoto@protonmail.com>"]
homepage = "https://github.com/rust-nostr/nostr-sync"
repository = "https://github.com/rust-nostr/nostr-sync.git"
license = "MIT"
rust-version = "1.85.0"

[dependencies]
dirs = "6.0.0"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
tokio = { version = "1.50.0", features = ["fs", "macros", "rt-multi-thread"] }
toml = "1.0.7"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
